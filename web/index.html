<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaLive — Speech Translation Console</title>
    <meta
      name="description"
      content="Real-time speech translation across 202 languages, powered by NLLB-200, Whisper and MMS-TTS."
    />
    <meta name="theme-color" content="#f2efe6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fraunces carries the display type (variable, with the WONK axis enabled
      for its alternate glyphs). IBM Plex Sans and Mono handle UI and technical
      readouts; Plex is the most script-complete open family, which matters for
      a product that renders 202 languages.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
